name: claimgate

# LOCAL APP IMAGE / HEALTH SMOKE ONLY. Never combine this file with the
# production Nginx vhost. Production supports only the two-systemd-unit path.

services:
  app:
    image: claimgate:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - path: ../.env.production.local
        required: false
    environment:
      CLAIMGATE_DATABASE_PATH: /var/lib/claimgate/claimgate.db
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "3000"
    ports:
      - "127.0.0.1:18121:3000"
    volumes:
      - claimgate-data:/var/lib/claimgate
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    stop_grace_period: 20s
    networks:
      - runtime

networks:
  runtime:
    internal: true

volumes:
  claimgate-data:
    name: claimgate-data
